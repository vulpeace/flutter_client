name: Android Stable FCM Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      android_build_number:
        description: Pre-allocated Nodus Android versionCode for this release
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-stable:
    name: Build stable APK and AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'workflow_call' && 'stable' || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Resolve stable version name
        id: stable_version_name
        run: python3 .github/scripts/app_version.py read

      - name: Resolve build number
        id: android_build_number
        env:
          PREALLOCATED_BUILD_NUMBER: ${{ inputs.android_build_number }}
        run: echo "build_number=${PREALLOCATED_BUILD_NUMBER:-$(git rev-list --count HEAD)}" >> "$GITHUB_OUTPUT"

      - name: Sync submodules
        run: git submodule update --init --recursive

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore Gradle cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-stable-fcm-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-stable-fcm-
            ${{ runner.os }}-gradle-

      - name: Set up Flutter
        uses: axi92/flutter-action@72633a794ba0b23276fa4fc465a6cacb758a90c5
        with:
          channel: stable
      - name: Restore pub cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Configure Android FCM build tree
        run: dart tool/configure_build.dart --profile=android-fcm

      - name: Write firebase_options.dart
        env:
          FIREBASE_OPTIONS_JSON: ${{ secrets.FIREBASE_OPTIONS_JSON }}
        run: dart tool/write_firebase_options.dart --environment=stable

      - name: Set up Rust for the native markdown parser
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            . "$HOME/.cargo/env"
          fi
          rustup show active-toolchain || rustup toolchain install stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          flutter config --enable-native-assets

      - name: Resolve unifiedpush_linux to the stub
        run: bash tool/apply_macos_pub_overrides.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build

      - name: Create Android signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          cat > android/key.properties << EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF

      - name: Write Android ADI registration file
        env:
          ANDROID_ADI_REGISTRATION_SNIPPET: ${{ secrets.ANDROID_ADI_REGISTRATION_SNIPPET }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_ADI_REGISTRATION_SNIPPET" ]; then
            echo "::warning::ANDROID_ADI_REGISTRATION_SNIPPET secret is not set. Add the Play Console identifier under Settings -> Secrets and variables -> Actions -> Secrets if you need adi-registration.properties in the APK."
            exit 0
          fi
          mkdir -p android/app/src/main/assets
          printf '%s\n' "$ANDROID_ADI_REGISTRATION_SNIPPET" > android/app/src/main/assets/adi-registration.properties

      - name: Configure Google services for stable
        env:
          GOOGLE_SERVICES_JSON_ANDROID: ${{ secrets.GOOGLE_SERVICES_JSON_ANDROID }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_ANDROID" ]; then
            echo "$GOOGLE_SERVICES_JSON_ANDROID" > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_ANDROID secret is not set. Existing android/app/google-services.json will be used."
          fi

      - name: Write Measure Android config
        env:
          MEASURE_RELEASE_CHANNEL: stable
          MEASURE_ANDROID_API_KEY_STABLE: ${{ secrets.MEASURE_ANDROID_API_KEY_STABLE }}
          MEASURE_ANDROID_API_KEY: ${{ secrets.MEASURE_ANDROID_API_KEY }}
          MEASURE_API_URL: ${{ secrets.MEASURE_API_URL }}
        run: tool/measure/write_native_measure_config.sh

      - name: Build stable split APKs
        run: flutter build apk --release --split-per-abi --flavor stableFcm --build-name ${{ steps.stable_version_name.outputs.version }} --build-number ${{ steps.android_build_number.outputs.build_number }} -P force-version-code-ignoring-abi=true --dart-define-from-file=tool/dart_defines/stable.json --dart-define=PUSH_PROVIDER=fcm --dart-define=PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER=${{ vars.PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }} --dart-define=BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --dart-define=PUSH_RELAY_ORIGIN="${{ secrets.PUSH_RELAY_ORIGIN }}"

      - name: Build stable app bundle
        run: flutter build appbundle --release --flavor stableFcm --build-name ${{ steps.stable_version_name.outputs.version }} --build-number ${{ steps.android_build_number.outputs.build_number }} --dart-define-from-file=tool/dart_defines/stable.json --dart-define=PUSH_PROVIDER=fcm --dart-define=PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER=${{ vars.PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER }} --dart-define=BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --dart-define=PUSH_RELAY_ORIGIN="${{ secrets.PUSH_RELAY_ORIGIN }}"

      - name: Set up Ruby
        uses: ruby/setup-ruby@4c56a21280b36d862b5fc31348f463d60bdc55d5
        with:
          ruby-version: "4.0"
      - name: Restore Bundler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-bundler-ruby-4.0-${{ hashFiles('Gemfile.lock', 'Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-bundler-ruby-4.0-
      - name: Install Ruby gems
        run: |
          bundle config set path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: Upload stable FCM APK artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: stable-fcm-apk
          path: build/app/outputs/flutter-apk/*-stablefcm-release.apk
          if-no-files-found: error

      - name: Upload stable FCM AAB artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: stable-fcm-aab
          path: build/app/outputs/bundle/stableFcmRelease/app-stable-fcm-release.aab
          if-no-files-found: error

      - name: Publish APK to a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.stable_version_name.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve stable version name"
            exit 1
          fi
          mkdir -p publish
          cp build/app/outputs/flutter-apk/*stablefcm*.apk publish/
          shopt -s nullglob
          assets=(publish/*.apk)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No stable FCM APKs found to publish"
            exit 1
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG exists, replacing its assets"
            gh release upload "$TAG" "${assets[@]}" \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes "Automated build from ${{ github.sha }}"
          fi

      - name: Attest stable FCM release binaries
        uses: ./.github/actions/attest-android-binaries
        with:
          patterns: |
            build/app/outputs/flutter-apk/*-stablefcm-release.apk
            build/app/outputs/bundle/stableFcmRelease/app-stable-fcm-release.aab

      - name: Upload stable AAB to Google Play as draft
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.SUPPLY_JSON_KEY_DATA }}
          PLAY_STORE_TRACK: production
        run: |
          if ! bundle exec fastlane android upload_stable_fcm_aab; then
            echo "::warning::Google Play upload failed. APK/AAB artifacts will still be uploaded."
          fi
